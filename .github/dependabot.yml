version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    ignore:
      # 3.3.x fails with oneDNN in the OCR engine (see pyproject.toml); lift after testing a newer release.
      - dependency-name: paddlepaddle
        versions: [">=3.3"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
