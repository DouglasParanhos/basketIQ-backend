[project]
name = "basketiq"
version = "0.1.0"
description = "BasketIQ backend: API, document processing pipeline and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "authlib>=1.3",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "dramatiq[redis]>=1.17",
    "redis>=5.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "slowapi>=0.1.9",
    "pdfplumber>=0.11",
    "pypdf>=6.21.2",  # uploaded PDFs are parsed here: 6.21.2 fixes the DoS advisories of 6.20
    "pypdfium2>=4.30",
    "pillow>=13.0.0",  # uploaded images are decoded here: 13.0.0 fixes the decoder advisories of 12.x
    "pillow-heif>=0.18",
    "zxing-cpp>=3.1",  # local reader of the fiscal QR code (Apache-2.0)
    "numpy>=1.26",
    "filetype>=1.2",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0",
    # Pinned below 3.3: paddlepaddle 3.3.1 fails with oneDNN ("ConvertPirAttribute2RuntimeAttribute") on
    # PP-OCRv5, which forced enable_mkldnn=False and made photo OCR ~3x slower. Revisit when fixed upstream.
    "paddlepaddle==3.2.2",
]
llm = [
    "agno>=3.1",
    "ollama>=0.4",
    # agno.models.ollama imports agno.models.openai at package import time; no OpenAI calls are made.
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "reportlab>=4.2",
    "types-redis",
    "types-PyYAML",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basketiq"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "req(id): links the test to a requirement / test-plan id (e.g. F-26, RF-06)",
    "integration: needs Postgres/Redis/MinIO",
    "ocr: needs PaddleOCR models",
    "llm: needs a running Ollama",
    "golden_real: needs the real receipts in GOLDEN_REAL_DIR",
]
