# Product decisions and feature flags. Single source of truth for these values: the API and the
# worker read this file at start-up and refuse to start if it is missing or invalid.
# Edit it, then restart the API and the worker (the file is mounted into the containers).
#
# Secrets, connection strings and per-environment infrastructure settings stay in environment
# variables (BASKETIQ_*, see .env.example); they do not belong here.

# Product name shown to customers: login screen, page title, installed-app name (PWA manifest).
# 1 to 40 characters. The repositories and technical documents keep the project name, BasketIQ.
APP_NAME_FOR_CUSTOMER: Super Mercado

# Local LLM agent (Agno + Ollama) that proposes values for receipt lines the deterministic parser
# could not read. Every value it proposes is still checked against the receipt text.
# true needs the Ollama service (make up-llm); false never calls a LLM.
# The external OCR/AI fallback is configured separately (BASKETIQ_EXTERNAL_FALLBACK).
LLM_ENABLED: false

# Smart shopping list (RF-16): shows the «Lista» destination in the app. It is built after step C and
# stays false until it is approved: with false the client hides it. The client reads this value from
# GET /v1/config. true or false only.
SMART_LIST_ENABLED: false

# Window, in days, of the smart list's prices (RF-16) and of the step C comparison (D11): only confirmed purchases
# from the last N days count, today included. Whole number, 7 to 366.
COMPARISON_WINDOW_DAYS: 90

# Step C comparison (spec 010; RASCUNHO D11 and D12, approved on 2026-11-08). Only purchases of the same product group
# with a known size count. A line is «above/below what you usually pay» when the user has at least
# COMPARISON_MIN_PURCHASES earlier purchases of the group in the window, the price differs from their average by at
# least COMPARISON_DIFFERENCE_PCT percent and the effect on the line is at least COMPARISON_MIN_EFFECT_CENTS cents;
# otherwise «normal». Chains are compared per group only with COMPARISON_MIN_CHAINS chains of COMPARISON_MIN_PURCHASES
# purchases each, with the same two thresholds on a typical purchase. Whole numbers.
COMPARISON_MIN_PURCHASES: 3
COMPARISON_DIFFERENCE_PCT: 15
COMPARISON_MIN_EFFECT_CENTS: 20
COMPARISON_MIN_CHAINS: 2

# «Por completar» (D13): how many descriptions each tab shows at a time, the ones with the most spending first.
TO_COMPLETE_PAGE_SIZE: 10

# Home goal ring (RF-15). The band is decided on the goal percentage rounded to a whole number (half up),
# the same number the screen shows: green up to GOAL_RING_GREEN_UP_TO_PCT inclusive, orange above it up to
# GOAL_RING_ORANGE_UP_TO_PCT inclusive, red above. Whole numbers, 1 <= green < orange <= 100.
GOAL_RING_GREEN_UP_TO_PCT: 50
GOAL_RING_ORANGE_UP_TO_PCT: 75

# Monthly average (RF-15): the fewest complete months with confirmed receipts before an average is shown
# (1 to 12), and how far, in percent (0 to 50), the last two months may be from the average and still be
# reported as «on the average».
AVERAGE_MIN_MONTHS: 2
AVERAGE_ON_TARGET_PCT: 5
