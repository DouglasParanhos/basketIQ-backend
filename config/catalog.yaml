              not_belongs: [CREME DE COGUMELOS]
          - slug: mistura-de-legumes
            name: Mistura de legumes
            match: ['\bMISTURA DE LEGUMES\b', '\bSALTEADO DE LEGUMES\b', *mixed_veg]
            exclude: ['\b(SOPA|CREME)\b']
            cases:
