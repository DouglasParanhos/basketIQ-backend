            name: Banana
            match: ['\bBANANAS?\b']
            exclude: ['\b(CHIPS|SECA|DESIDRATADA|IOGURTE|BATIDO|SUMO|NECTAR)\b']
            cases:
              belongs: [BANANA, BANANA DA MADEIRA, BANANAS CAT I]
              not_belongs: [CHIPS DE BANANA 100G]
          - slug: maca
            name: Maçã
            match: ['\bMACAS?\b']
            exclude: ['\b(SIDRA|SUMO|NECTAR|COMPOTA|PURE|VINAGRE|CHIPS|DOCE)\b']
            cases:
              belongs: [MAÇÃ PINK, MACA GALA KG, MAÇÃS ROYAL GALA 1KG]
              not_belongs: [SIDRA DE MAÇÃ 50CL, SUMO DE MAÇÃ 1L]
          - slug: laranja
            name: Laranja
            match: ['\bLARANJAS?\b']
            exclude: ['\b(SUMO|NECTAR|DOCE|COMPOTA|REFRIGERANTE|SABOR|BEBIDA|GELADO|SUMOL)\b']
            cases:
