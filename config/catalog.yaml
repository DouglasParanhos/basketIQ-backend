              belongs: [CENOURA 2KG, CENOURA KG, CENOURAS BIO 1KG]
              not_belongs: [COUVE FLOR BROCOLOS CENOURA 1KG, SUMO DE CENOURA]
          - slug: brocolos
            name: Brócolos
            match: ['\bBROCOLOS?\b']
            exclude: ['\b(CONGELADO|CONGELADOS|SOPA|CREME)\b', *mixed_veg]
            cases:
              belongs: [BRÓCOLOS, BROCOLO 500 G, BIO BROCOLO 400 G]
              not_belongs: [PINGO_DOCE | BROCOLOS CONG PD400G, PINGO_DOCE | COUVE FL BR CE PD1KG]
          - slug: couve-flor
            name: Couve-flor
            match: ['\bCOUVE FLOR\b']
            exclude: [*mixed_veg]
            cases:
              belongs: [COUVE FLOR, COUVE-FLOR, COUVE FLOR KG]
              not_belongs: [MERCADONA | COUVE-FLOR/BROC/CEN, COUVE PORTUGUESA]
          - slug: curgete
            name: Curgete
            match: ['\bCURGETES?\b']
            exclude: ['\b(ESPARGUETE|ESPIRAIS|CREME|SOPA)\b']
