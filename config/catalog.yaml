# Product catalogue (step C, D1–D6 of RASCUNHO_decisoes_spec010, approved on 2026-11-08). Single source of the
# group rules: a change goes in by commit, with the rule and its cases in the same commit (D8). The API reads this
# file at start-up and refuses to start if it is invalid (basketiq.catalog). Raise `version` whenever a rule changes.
#
# Tree: the 15 classes of Funcional v1.5 §12.1 at the top (only for navigation, never a spending category), nodes in
# between, groups at the leaves. Only a group is compared. A description matching two groups, or none, is left «por
# agrupar» (D2b); one matching only a node keeps the node as a hint. Brand is never part of a rule (D2c).
#
# Rules are Python regular expressions over the description after normalisation (upper case, no accents, every
# character other than A-Z, 0-9 and % turned into a space) and after the abbreviations below are expanded. `exclude`
# also applies to every group under the node that declares it. `list_category`: the shopping list category
# (domain/categories.py) of the node and of everything below it. `bases`: comparison bases in order of preference
# (D1); each one needs a plausible range in `plausible_sizes` (D9). Inherited by the nodes below.
#
# Cases (D6): loose line descriptions only, never prices, dates or whole receipts; at least 3 that belong and 1 that
# does not, per group. «CHAIN | description» reads the case as printed by that chain (its abbreviations apply).

version: 2

# Patterns used by more than one rule, declared once (YAML anchors; the loader ignores this key otherwise).
patterns:
  # A bag with two of these vegetables is a mixture, not one vegetable.
  mixed_veg: &mixed_veg '\b(BROCOLOS?|COUVE FLOR|CENOURAS?)\b.*\b(BROCOLOS?|COUVE FLOR|CENOURAS?)\b'

# D9: a size outside these limits counts as missing. One package, in the base unit.
plausible_sizes:
  kg: ["0.005", "30"]
  l: ["0.01", "20"]
  un: ["1", "200"]
  rolo: ["1", "64"]
  dose: ["1", "200"]

# D5: expansions, by whole word. A chain's entry beats the one under `all`.
abbreviations:
  all:
    QJ: QUEIJO
    IOG: IOGURTE
    FRG: FRANGO
    BOV: BOVINO
    FRS: FRESCO
    RAL: RALADO
    LGHT: LIGHT
    CHOCOLAT: CHOCOLATE
    PIC: PICADA
    FAT: FATIAS
    LIQ: LIQUIDO
    DET: DETERGENTE
  PINGO_DOCE:
    MNT: MANTEIGA
    I: IOGURTE
    B: BOLACHA
    BAT: BATATA
    FL: FLOR
    BR: BROCOLOS
    CE: CENOURA
    LINHA: MASSA LINHA
    CONG: CONGELADO
  MERCADONA:
    Q: QUEIJO
    BROC: BROCOLOS
    CEN: CENOURA

classes:
  - slug: frutas-e-legumes
    name: Frutas e legumes
    list_category: frutas_legumes
