            exclude: ['\b(MOLHO|POLPA|PELADO|CONCENTRADO|PASSATA|SECO|CHERRY|CEREJA|KETCHUP|RUCULA|PIZZA|SUMO|SARDINHA|PETINGA|SAN MARZANO|TRITURADO)\b']
            cases:
              belongs: [TOMATE ALONGADO, TOMATE REDONDO KG, TOMATE EM RAMO]
              not_belongs: [TOMATE CHERRY 250G, MOLHO DE TOMATE, TOMATE SAN MARZANO 400G]
          - slug: batata
            name: Batata
            match: ['\bBATATAS?\b']
            exclude: ['\b(DOCE|DOCES|PALHA|FRITA|FRITAS|CHIPS|PURE|GNOCCHI|RUSTICAS|ENCARACOLADA|TORTILHA|CONGELADO|PALITOS)\b']
            cases:
              belongs: ['BATATA BRANCA 2,5KG', PINGO_DOCE | BAT QUAR ASSAR PD1KG, BATATA VERMELHA KG]
              not_belongs: [BATATA DOCE 1KG, BATATA PALHA LIGHT, PURE DE BATATA]
          - slug: batata-doce
            name: Batata-doce
            match: ['\bBATATAS? DOCES?\b']
            exclude: ['\b(CHIPS|FRITA|FRITAS|PURE)\b']
            cases:
              belongs: [BATATA DOCE, BATATA DOCE 1KG, BATATA-DOCE KG]
              not_belongs: [CHIPS DE BATATA DOCE 100G]
          - slug: cebola
            name: Cebola
            match: ['\bCEBOLAS?\b']
            exclude: ['\b(PICADA|FRITA|CREME|SOPA|TORTILHA|CONGELADO|ANEIS)\b']
            cases:
              belongs: [CEBOLA DOCE 500G, CEBOLA KG, CEBOLAS 2KG]
              not_belongs: [CEBOLA PICADA, CEBOLA FRITA 100G]
          - slug: cenoura
            name: Cenoura
            match: ['\bCENOURAS?\b']
            exclude: ['\b(SUMO|SOPA|CREME|BOLO)\b', *mixed_veg]
